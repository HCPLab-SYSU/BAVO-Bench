[tool.poetry]
name = "bavo-bench"
version = "0.1.0"
description = "BAVO-Bench simulation benchmark environments"
packages = [{include = "bavo_bench"}]

[tool.poetry.dependencies]
python = "^3.10"
numpy = ">=1.23"
gymnasium = ">=0.29,<1.0"
mujoco = "3.5.0"
dm-control = "1.0.37"
datasets = "3.3.2"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
